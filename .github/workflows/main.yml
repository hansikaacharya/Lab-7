name: Check README

on:
  push:
    branches:
      - main
      - git-branch

jobs:
  check-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README file
        run: |
          if [ -f README.md ]; then
            echo "README.md exists"
          else
            echo "README.md not found"
            exit 1
          fi
